services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: muse_identity
      POSTGRES_USER: muse
      POSTGRES_PASSWORD: secret
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muse -d muse_identity"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  identity-svc:
    build: ./music-identity-gatekeeper
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: "postgres://muse:secret@postgres:5432/muse_identity?sslmode=disable"
      REDIS_ADDR: "redis:6379"