name: CI
on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26' }
        
      
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with: { version: latest, working-directory: ./music-identity-gatekeeper , only-new-issues: false }
      
      - name: Build & Test
        run: |
          go vet ./...
          go test -race -v ./...