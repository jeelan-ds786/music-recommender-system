name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: music-identity-gatekeeper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: music-identity-gatekeeper/go.mod
          cache-dependency-path: music-identity-gatekeeper/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Check module integrity
        run: |
          go mod tidy -diff
          go mod verify

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: music-identity-gatekeeper
          only-new-issues: false

      - name: Vet
        run: go vet ./...

      - name: Build commands
        run: go build ./cmd/api ./cmd/server

      - name: Test with race detection and coverage
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: music-identity-gatekeeper/coverage.out
          if-no-files-found: error
          retention-days: 14

  playback-quality:
    name: Playback Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: music-playback-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: music-playback-service/go.mod
          cache-dependency-path: music-playback-service/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Check module integrity
        run: |
          go mod tidy -diff
          go mod verify

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: music-playback-service
          only-new-issues: false

      - name: Vet
        run: go vet ./...

      - name: Build command
        run: go build ./cmd/server

      - name: Test with race detection
        run: go test -race ./...

  vulnerabilities:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.26.6
          check-latest: false
          go-version-file: music-identity-gatekeeper/go.mod
          cache-dependency-path: music-identity-gatekeeper/go.sum
          work-dir: music-identity-gatekeeper
          go-package: ./...

  migrations:
    name: Migration round trip
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: muse_identity
          POSTGRES_USER: muse
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muse -d muse_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: music-identity-gatekeeper/go.mod
          cache-dependency-path: music-identity-gatekeeper/go.sum

      - name: Install migration tool
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Apply, roll back, and reapply migrations
        working-directory: music-identity-gatekeeper
        env:
          DB_URL: postgres://muse:secret@localhost:5432/muse_identity?sslmode=disable
        run: |
          migrate -path migrations -database "$DB_URL" up
          migrate -path migrations -database "$DB_URL" down -all
          migrate -path migrations -database "$DB_URL" up

  playback-migrations:
    name: Playback migration round trip
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: muse_playback
          POSTGRES_USER: muse
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muse -d muse_playback"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: music-playback-service/go.mod
          cache-dependency-path: music-playback-service/go.sum

      - name: Install migration tool
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Apply, roll back, and reapply migrations
        working-directory: music-playback-service
        env:
          DB_URL: postgres://muse:secret@localhost:5432/muse_playback?sslmode=disable
          PGPASSWORD: secret
        run: |
          migrate -path migrations -database "$DB_URL" up
          migrate -path migrations -database "$DB_URL" down -all
          migrate -path migrations -database "$DB_URL" up
          test "$(psql -h localhost -U muse -d muse_playback -Atc "SELECT count(*) FROM information_schema.table_constraints WHERE table_name = 'playback_events' AND constraint_type = 'FOREIGN KEY'")" = "0"
          psql -h localhost -U muse -d muse_playback -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            BEGIN
              INSERT INTO playback_events (id, client_event_id, user_id, song_id, session_id, event_type, occurred_at, position_ms, device_type)
              VALUES (gen_random_uuid(), gen_random_uuid(), gen_random_uuid(), gen_random_uuid(), gen_random_uuid(), 'invalid', NOW(), 0, 'ci');
              RAISE EXCEPTION 'unsupported event type was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO playback_events (id, client_event_id, user_id, song_id, session_id, event_type, occurred_at, position_ms, device_type)
              VALUES (gen_random_uuid(), gen_random_uuid(), gen_random_uuid(), gen_random_uuid(), gen_random_uuid(), 'play', NOW(), -1, 'ci');
              RAISE EXCEPTION 'negative position was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              INSERT INTO playback_events (id, client_event_id, user_id, song_id, session_id, event_type, occurred_at, position_ms, duration_ms, device_type)
              VALUES (gen_random_uuid(), gen_random_uuid(), gen_random_uuid(), gen_random_uuid(), gen_random_uuid(), 'play', NOW(), 0, -1, 'ci');
              RAISE EXCEPTION 'negative duration was accepted';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END
          $$;
          SQL

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: music-identity-gatekeeper/Dockerfile

      - name: Build image
        run: docker build --tag music-identity-gatekeeper:${{ github.sha }} music-identity-gatekeeper

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: music-identity-gatekeeper:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: music-identity-gatekeeper:${{ github.sha }}
          artifact-name: identity-service-sbom.spdx.json
          format: spdx-json
          upload-artifact-retention: 14
          upload-release-assets: false

  playback-container:
    name: Playback container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: music-playback-service/Dockerfile

      - name: Build image
        run: docker build --tag music-playback-service:${{ github.sha }} music-playback-service