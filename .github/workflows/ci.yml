name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: music-identity-gatekeeper

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: music-identity-gatekeeper/go.mod
          cache-dependency-path: music-identity-gatekeeper/go.sum

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Check module integrity
        run: |
          go mod tidy -diff
          go mod verify

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          working-directory: music-identity-gatekeeper
          only-new-issues: false

      - name: Vet
        run: go vet ./...

      - name: Build commands
        run: go build ./cmd/api ./cmd/server

      - name: Test with race detection and coverage
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: music-identity-gatekeeper/coverage.out
          if-no-files-found: error
          retention-days: 14

  vulnerabilities:
    name: Go vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: music-identity-gatekeeper/go.mod
          cache-dependency-path: music-identity-gatekeeper/go.sum
          work-dir: music-identity-gatekeeper
          go-package: ./...

  migrations:
    name: Migration round trip
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: muse_identity
          POSTGRES_USER: muse
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muse -d muse_identity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: music-identity-gatekeeper/go.mod
          cache-dependency-path: music-identity-gatekeeper/go.sum

      - name: Install migration tool
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Apply, roll back, and reapply migrations
        working-directory: music-identity-gatekeeper
        env:
          DB_URL: postgres://muse:secret@localhost:5432/muse_identity?sslmode=disable
        run: |
          migrate -path migrations -database "$DB_URL" up
          migrate -path migrations -database "$DB_URL" down -all
          migrate -path migrations -database "$DB_URL" up

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: music-identity-gatekeeper/Dockerfile

      - name: Build image
        run: docker build --tag music-identity-gatekeeper:${{ github.sha }} music-identity-gatekeeper

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: music-identity-gatekeeper:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: music-identity-gatekeeper:${{ github.sha }}
          artifact-name: identity-service-sbom.spdx.json
          format: spdx-json
          upload-artifact-retention: 14
          upload-release-assets: false